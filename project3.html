<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Three - Fthggg</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #000;
      font-family: 'Bangers', cursive;
    }

    .back-link {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 200;
      font-family: sans-serif;
      font-size: 0.95rem;
      color: white;
      background: #e23636;
      padding: 8px 16px;
      border-radius: 20px;
      text-decoration: none;
      border: 3px solid #1a237e;
      box-shadow: 3px 3px 0 #000;
    }

    /* ===== Layar HP: postingan gaya Instagram ===== */
    .phone-content {
      min-height: 100vh;
      background: #000;
      color: #f5f5f5;
      display: flex;
      justify-content: center;
      padding: 72px 0 48px;
      font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    .post {
      width: min(100%, 470px, max(280px, calc((100vh - 300px) * 0.8)));
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 0.6s ease 0.2s, transform 0.6s ease 0.2s;
    }

    body.revealed .post {
      opacity: 1;
      transform: none;
    }

    .post-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px 10px;
    }

    .avatar-ring {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      padding: 2px;
      background: linear-gradient(45deg, #f9ce34, #ee2a7b, #6228d7);
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid #000;
      background: #262626;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      overflow: hidden;
    }

    .avatar img { width: 100%; height: 100%; object-fit: cover; }

    .post-user {
      font-weight: 600;
      font-size: 0.9rem;
    }

    .post-more {
      margin-left: auto;
      letter-spacing: 2px;
      font-weight: 700;
      color: #a8a8a8;
    }

    .post-media {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 5;
      background: #262626;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: pan-y;
      cursor: grab;
    }

    .post-media.dragging { cursor: grabbing; }

    /* Slide nempel tanpa jarak, jadi benang di gambar kelihatan nyambung pas digeser */
    .carousel-track {
      display: flex;
      height: 100%;
      will-change: transform;
    }

    .carousel-slide {
      flex: 0 0 100%;
      height: 100%;
    }

    .carousel-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    .slide-counter {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 14px;
      pointer-events: none;
    }

    .nav {
      position: absolute;
      top: 50%;
      width: 28px;
      height: 28px;
      margin-top: -14px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.85);
      color: #262626;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .nav svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .nav.prev { left: 8px; }
    .nav.next { right: 8px; }
    .post-media:hover .nav { opacity: 1; }
    .nav.hidden, .post-media:hover .nav.hidden { opacity: 0; pointer-events: none; }
    @media (hover: none) { .nav { display: none; } }

    .dots {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      gap: 4px;
      pointer-events: none;
    }

    .dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #555;
      transition: background 0.2s ease;
    }

    .dots span.active { background: #0095f6; }

    .heart-pop {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 96px;
      height: 96px;
      margin: -48px 0 0 -48px;
      fill: #fff;
      opacity: 0;
      pointer-events: none;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));
    }

    .heart-pop.show { animation: heartPop 0.9s ease; }

    @keyframes heartPop {
      0%   { opacity: 0; transform: scale(0.3); }
      20%  { opacity: 1; transform: scale(1.15); }
      40%  { transform: scale(0.95); }
      60%  { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.1); }
    }

    .post-actions {
      position: relative;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 12px 6px;
    }

    .post-actions .spacer { margin-left: auto; }

    .icon-btn {
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      color: #f5f5f5;
      display: flex;
    }

    .icon-btn svg {
      width: 26px;
      height: 26px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.15s ease;
    }

    .icon-btn:active svg { transform: scale(0.85); }

    #like-btn.liked svg {
      fill: #ff3040;
      stroke: #ff3040;
      animation: likeBump 0.35s ease;
    }

    @keyframes likeBump {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.3); }
      100% { transform: scale(1); }
    }

    .post-likes {
      padding: 0 12px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .post-caption {
      padding: 6px 12px 0;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .post-caption b { font-weight: 600; margin-right: 4px; }

    .post-time {
      padding: 8px 12px 0;
      font-size: 0.7rem;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      color: #a8a8a8;
    }

    /* ===== Intro zoom ke HP ===== */
    .zoom-intro {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.7s ease;
    }

    .zoom-intro.done {
      opacity: 0;
      pointer-events: none;
    }

    .zoom-stage {
      width: min(100vw, calc(100vh * 0.7991));
      aspect-ratio: 736 / 921;
      will-change: transform;
    }

    .zoom-stage img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <a href="index.html" class="back-link">&larr; Kembali ke Home</a>

  <div class="zoom-intro" id="zoom-intro">
    <div class="zoom-stage" id="zoom-stage">
      <img src="download.jfif" alt="" id="zoom-img">
    </div>
  </div>

  <!-- Layar HP: postingan gaya Instagram (ganti isinya sesuai keinginan) -->
  <main class="phone-content" id="phone-content">
    <article class="post">
      <div class="post-header">
        <div class="avatar-ring"><div class="avatar">F</div></div>
        <span class="post-user">fthggg</span>
        <span class="post-more">&middot;&middot;&middot;</span>
      </div>

      <div class="post-media" id="post-media">
        <!-- Slide-nya dibuat otomatis dari daftar SLIDES di script bawah -->
        <div class="carousel-track" id="carousel-track"></div>
        <div class="slide-counter" id="slide-counter"></div>
        <button class="nav prev" id="nav-prev" aria-label="Sebelumnya"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
        <button class="nav next" id="nav-next" aria-label="Berikutnya"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button>
        <svg class="heart-pop" id="heart-pop" viewBox="0 0 24 24">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
      </div>

      <div class="post-actions">
        <button class="icon-btn" id="like-btn" aria-label="Suka">
          <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </button>
        <button class="icon-btn" aria-label="Komentar">
          <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        </button>
        <button class="icon-btn" aria-label="Kirim">
          <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
        <div class="dots" id="dots"></div>
        <button class="icon-btn spacer" aria-label="Simpan">
          <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        </button>
      </div>

      <div class="post-likes"><span id="like-count">1,2 JT</span> suka</div>
      <div class="post-caption"><b>fthggg</b> I don't even know you.</div>
      <div class="post-time">2 jam yang lalu</div>
    </article>

  </main>

  <script>
    // ===== Zoom in ke HP =====
    (function() {
      const intro = document.getElementById('zoom-intro');
      const stage = document.getElementById('zoom-stage');
      const img = document.getElementById('zoom-img');

      // Posisi HP di dalam gambar (0 - 1). Geser kalau kurang pas.
      const PHONE_X = 0.312;  // 0 = kiri, 1 = kanan
      const PHONE_Y = 0.397;  // 0 = atas, 1 = bawah
      const ZOOM = 10;        // makin besar makin dalam
      const DURASI = 2200;    // ms
      const DELAY = 1200;     // jeda sebelum mulai zoom

      function reveal() { document.body.classList.add('revealed'); }

      function finish() {
        reveal();
        intro.classList.add('done');
        setTimeout(function() { intro.style.display = 'none'; }, 800);
      }

      // Kalau gambar nggak ada / user pilih kurangi animasi, langsung skip
      img.addEventListener('error', function() { intro.style.display = 'none'; reveal(); });
      if (img.complete && img.naturalWidth === 0) { intro.style.display = 'none'; reveal(); return; }
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        intro.style.display = 'none';
        reveal();
        return;
      }

      let started = false;
      function play() {
        if (started) { finish(); return; }   // klik lagi = skip
        started = true;

        const r = stage.getBoundingClientRect();
        const px = r.left + r.width * PHONE_X;
        const py = r.top + r.height * PHONE_Y;
        const dx = window.innerWidth / 2 - px;
        const dy = window.innerHeight / 2 - py;

        stage.style.transformOrigin = (PHONE_X * 100) + '% ' + (PHONE_Y * 100) + '%';
        stage.style.transition = 'transform ' + DURASI + 'ms cubic-bezier(0.65, 0, 0.35, 1)';
        stage.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + ZOOM + ')';

        setTimeout(finish, DURASI - 200);
      }

      setTimeout(play, DELAY);
      intro.addEventListener('click', play);
    })();
  </script>

  <script>
    // ===== Slide ala Instagram (geser kiri/kanan) =====
    (function() {
      // Urutan slide. Tambah / hapus baris sesuka kamu.
      const SLIDES = [
        'hand.jpeg',   // tangan + "swipe left"
        'web1.jpeg',   // benang
        'web2.jpeg',   // benang (hapus baris ini kalau nggak mau dobel)
        'text.jpeg',    // "Thank you for visiting"
      ];

      const viewport = document.getElementById('post-media');
      const track = document.getElementById('carousel-track');
      const counter = document.getElementById('slide-counter');
      const dotsEl = document.getElementById('dots');
      const prevBtn = document.getElementById('nav-prev');
      const nextBtn = document.getElementById('nav-next');
      const n = SLIDES.length;

      SLIDES.forEach(function(src, i) {
        const slide = document.createElement('div');
        slide.className = 'carousel-slide';
        const img = document.createElement('img');
        img.src = src;
        img.alt = 'Slide ' + (i + 1);
        img.draggable = false;
        img.onerror = function() { img.style.visibility = 'hidden'; };
        slide.appendChild(img);
        track.appendChild(slide);

        const dot = document.createElement('span');
        dotsEl.appendChild(dot);
      });

      let index = 0;
      let width = viewport.clientWidth;

      function setX(px, animate) {
        track.style.transition = animate ? 'transform 0.35s cubic-bezier(0.22, 0.8, 0.3, 1)' : 'none';
        track.style.transform = 'translateX(' + px + 'px)';
      }

      function updateUI() {
        counter.textContent = (index + 1) + '/' + n;
        Array.prototype.forEach.call(dotsEl.children, function(d, i) {
          d.classList.toggle('active', i === index);
        });
        prevBtn.classList.toggle('hidden', index === 0);
        nextBtn.classList.toggle('hidden', index === n - 1);
      }

      function go(i) {
        index = Math.max(0, Math.min(n - 1, i));
        width = viewport.clientWidth;
        setX(-index * width, true);
        updateUI();
      }

      if (n <= 1) {
        counter.style.display = 'none';
        dotsEl.style.display = 'none';
        prevBtn.style.display = 'none';
        nextBtn.style.display = 'none';
      }

      // --- geser pakai jari / mouse ---
      let startX = 0, dx = 0, dragging = false, moved = false;

      viewport.addEventListener('pointerdown', function(e) {
        if (e.target.closest('.nav')) return;
        dragging = true;
        moved = false;
        dx = 0;
        startX = e.clientX;
        width = viewport.clientWidth;
        viewport.setPointerCapture(e.pointerId);
      });

      viewport.addEventListener('pointermove', function(e) {
        if (!dragging) return;
        dx = e.clientX - startX;
        if (!moved && Math.abs(dx) > 6) { moved = true; viewport.classList.add('dragging'); }
        if (!moved) return;
        // di ujung slide, geserannya "berat" biar terasa mentok
        let shown = dx;
        if ((index === 0 && dx > 0) || (index === n - 1 && dx < 0)) shown = dx * 0.35;
        setX(-index * width + shown, false);
      });

      function endDrag() {
        if (!dragging) return;
        dragging = false;
        viewport.classList.remove('dragging');
        if (moved) {
          window.lastDragEnd = Date.now();
          const threshold = width * 0.18;
          if (dx < -threshold) go(index + 1);
          else if (dx > threshold) go(index - 1);
          else go(index);
        }
      }
      viewport.addEventListener('pointerup', endDrag);
      viewport.addEventListener('pointercancel', endDrag);

      // --- panah (desktop) & keyboard ---
      [prevBtn, nextBtn].forEach(function(b) {
        b.addEventListener('dblclick', function(e) { e.stopPropagation(); });
      });
      prevBtn.addEventListener('click', function() { go(index - 1); });
      nextBtn.addEventListener('click', function() { go(index + 1); });
      document.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowLeft') go(index - 1);
        if (e.key === 'ArrowRight') go(index + 1);
      });

      window.addEventListener('resize', function() {
        width = viewport.clientWidth;
        setX(-index * width, false);
      });

      updateUI();
    })();
  </script>

  <script>
    // ===== Suka postingan (tombol hati / dobel klik gambar) =====
    (function() {
      const likeBtn = document.getElementById('like-btn');
      const likeCount = document.getElementById('like-count');
      const media = document.getElementById('post-media');
      const heartPop = document.getElementById('heart-pop');
      let count = 1234;   // jumlah suka awal, ganti sesuka kamu
      let liked = false;

      function render() {
        likeBtn.classList.toggle('liked', liked);
        likeCount.textContent = count.toLocaleString('id-ID');
      }

      function setLiked(value) {
        if (liked === value) return;
        liked = value;
        count += liked ? 1 : -1;
        render();
      }

      likeBtn.addEventListener('click', function() { setLiked(!liked); });

      media.addEventListener('dblclick', function() {
        if (Date.now() - (window.lastDragEnd || 0) < 350) return;
        setLiked(true);
        heartPop.classList.remove('show');
        void heartPop.getBoundingClientRect();
        heartPop.classList.add('show');
      });

      render();
    })();
  </script>

</body>
</html>
