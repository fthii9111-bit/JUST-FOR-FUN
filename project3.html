<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Three - Fthggg</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Bangers', cursive;
      color: #e23636;
      text-align: center;
      background: #f5f5f5;
      padding-bottom: 60px;
    }

    .content {
      position: relative;
      z-index: 1;
      padding-top: 40px;
      max-width: 700px;
      margin: 0 auto;
      padding-left: 20px;
      padding-right: 20px;
    }

    .back-link {
      display: inline-block;
      font-family: sans-serif;
      font-size: 0.95rem;
      color: white;
      background: #e23636;
      padding: 8px 16px;
      border-radius: 20px;
      text-decoration: none;
      margin-bottom: 20px;
      border: 3px solid #1a237e;
      box-shadow: 3px 3px 0 #000;
    }

    h1 {
      font-size: 3rem;
      color: #1a237e;
      text-shadow: 3px 3px 0 rgba(0,0,0,0.15);
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .gallery-hint {
      font-family: sans-serif;
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 25px;
    }

    /* ===== Card viewer ===== */
    .card-viewer {
      position: relative;
      padding: 10px 30px 10px;
      overflow: hidden;
    }

    .card-image {
      width: 100%;
      max-width: 480px;
      aspect-ratio: 1 / 1;
      height: auto;
      border-radius: 14px;
      background: #fafafa;
      border: 2px dashed #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      color: #aaa;
      font-size: 0.9rem;
      overflow: hidden;
      margin: 0 auto 18px;
      animation: cardFade 0.4s ease;
    }

    .card-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    @keyframes cardFade {
      0%   { opacity: 0; transform: scale(0.97); }
      100% { opacity: 1; transform: scale(1); }
    }

    .card-title {
      font-family: sans-serif;
      font-weight: bold;
      font-size: 1.15rem;
      color: #1a237e;
      margin: 0 0 6px;
      animation: cardFade 0.4s ease;
    }

    .card-desc {
      font-family: sans-serif;
      font-size: 0.9rem;
      color: #555;
      line-height: 1.5;
      max-width: 480px;
      margin: 0 auto;
      animation: cardFade 0.4s ease;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: #1a237e;
      color: white;
      font-family: sans-serif;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
      z-index: 2;
    }

    .nav-btn:hover {
      transform: translateY(-50%) scale(1.1);
      background: #e23636;
    }

    .nav-btn.prev { left: -10px; }
    .nav-btn.next { right: -10px; }

    .swipe-hint {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 18px;
      font-family: sans-serif;
      font-size: 0.8rem;
      color: #999;
    }

    .swipe-hint svg { animation: nudge 1.4s ease-in-out infinite; }

    @keyframes nudge {
      0%, 100% { transform: translateX(0); opacity: 0.6; }
      50% { transform: translateX(6px); opacity: 1; }
    }

    .card-dots {
      display: none;
    }

    .card-dots span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ddd;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .card-dots span.active {
      background: #e23636;
      transform: scale(1.3);
    }
  
    /* ===== Intro zoom ke HP ===== */
    .zoom-intro {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.7s ease;
    }

    .zoom-intro.done {
      opacity: 0;
      pointer-events: none;
    }

    .zoom-stage {
      width: min(100vw, calc(100vh * 0.7991));
      aspect-ratio: 736 / 921;
      will-change: transform;
    }

    .zoom-stage img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <div class="zoom-intro" id="zoom-intro">
    <div class="zoom-stage" id="zoom-stage">
      <img src="project3-scene.jpg" alt="" id="zoom-img">
    </div>
  </div>


  <div class="content">
    <a href="index.html" class="back-link">&larr; Kembali ke Home</a>

    <div class="card-viewer" id="card-viewer">
      <button class="nav-btn prev" id="prev-btn">&#8249;</button>
      <button class="nav-btn next" id="next-btn">&#8250;</button>

      <div class="card-image" id="card-image">Ganti dengan gambar kamu</div>

      <div class="card-dots" id="card-dots"></div>
    </div>
  </div>

  <script>
    // GANTI data ini sesuai karya/foto kamu sendiri
    const cards = [
      { title: "Karya 1", desc: "Deskripsi singkat karya pertama.", image: "" },
      { title: "Karya 2", desc: "Deskripsi singkat karya kedua.", image: "" },
      { title: "Karya 3", desc: "Deskripsi singkat karya ketiga.", image: "" }
    ];

    let current = 0;
    const viewer = document.getElementById('card-viewer');
    const cardImage = document.getElementById('card-image');
    const cardDots = document.getElementById('card-dots');

    function restartAnim(el) {
      el.style.animation = 'none';
      void el.offsetWidth;
      el.style.animation = '';
    }

    function buildDots() {
      cardDots.innerHTML = '';
      cards.forEach(function(_, i) {
        const dot = document.createElement('span');
        if (i === current) dot.classList.add('active');
        dot.addEventListener('click', function() { goTo(i); });
        cardDots.appendChild(dot);
      });
    }

    function render() {
      const c = cards[current];

      if (c.image) {
        cardImage.innerHTML = '<img src="' + c.image + '" alt="Karya ' + (current + 1) + '">';
        cardImage.querySelector('img').style.display = 'block';
      } else {
        cardImage.innerHTML = 'Ganti dengan gambar kamu';
      }

      buildDots();
      restartAnim(cardImage);
    }

    function goTo(index) {
      current = (index + cards.length) % cards.length;
      render();
    }

    document.getElementById('next-btn').addEventListener('click', function() { goTo(current + 1); });
    document.getElementById('prev-btn').addEventListener('click', function() { goTo(current - 1); });

    // Swipe touch buat mobile
    let touchStartX = 0;
    viewer.addEventListener('touchstart', function(e) {
      touchStartX = e.changedTouches[0].clientX;
    });
    viewer.addEventListener('touchend', function(e) {
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (dx > 40) goTo(current - 1);
      else if (dx < -40) goTo(current + 1);
    });

    render();
  </script>

  

  <script>
    // ===== Zoom in ke HP =====
    (function() {
      const intro = document.getElementById('zoom-intro');
      const stage = document.getElementById('zoom-stage');
      const img = document.getElementById('zoom-img');

      // Posisi HP di dalam gambar (0 - 1). Geser kalau kurang pas.
      const PHONE_X = 0.312;  // 0 = kiri, 1 = kanan
      const PHONE_Y = 0.397;  // 0 = atas, 1 = bawah
      const ZOOM = 10;        // makin besar makin dalam
      const DURASI = 2200;    // ms
      const DELAY = 1200;     // jeda sebelum mulai zoom

      function finish() {
        intro.classList.add('done');
        setTimeout(function() { intro.style.display = 'none'; }, 800);
      }

      // Kalau gambar nggak ada / user pilih kurangi animasi, langsung skip
      img.addEventListener('error', function() { intro.style.display = 'none'; });
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        intro.style.display = 'none';
        return;
      }

      let started = false;
      function play() {
        if (started) { finish(); return; }   // klik lagi = skip
        started = true;

        const r = stage.getBoundingClientRect();
        const px = r.left + r.width * PHONE_X;
        const py = r.top + r.height * PHONE_Y;
        const dx = window.innerWidth / 2 - px;
        const dy = window.innerHeight / 2 - py;

        stage.style.transformOrigin = (PHONE_X * 100) + '% ' + (PHONE_Y * 100) + '%';
        stage.style.transition = 'transform ' + DURASI + 'ms cubic-bezier(0.65, 0, 0.35, 1)';
        stage.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + ZOOM + ')';

        setTimeout(finish, DURASI - 200);
      }

      setTimeout(play, DELAY);
      intro.addEventListener('click', play);
    })();
  </script>

</body>
</html>
