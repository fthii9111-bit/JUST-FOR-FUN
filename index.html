 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fthggg</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Bangers', cursive;
      color: #1a237e;
      text-align: center;
    }

    #bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }

    .content {
      position: relative;
      z-index: 1;
      padding-top: 60px;
    }

    h1 {
      font-size: 4rem;
      -webkit-text-stroke: 2px white;
      text-shadow: 4px 4px 0 #000;
      letter-spacing: 2px;
    }

    p {
      font-size: 1.5rem;
      background: white;
      display: inline-block;
      padding: 15px 25px;
      border: 4px solid black;
      border-radius: 20px;
      box-shadow: 6px 6px 0 black;
    }
  </style>
</head>
<body>

  <video autoplay muted loop id="bg-video">
    <source src="peter.mp4" type="video/mp4">
  </video>

  <div class="content">
    <h1 id="title">Hai, my name is Fathi</h1>
    <p>And I would like a coffee.</p>
  </div>

  <script>
    const title = document.getElementById('title');
    title.addEventListener('click', function() {
      alert('POW! 💥');
    });
  </script>

</body>
</html>
