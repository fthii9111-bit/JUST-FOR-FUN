<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Two - Fthggg</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Bangers', cursive;
      color: #e23636;
      text-align: center;
      background: linear-gradient(135deg, #0d1230 0%, #1a237e 60%, #10143a 100%);
      padding-bottom: 60px;
    }

    .content {
      position: relative;
      z-index: 1;
      padding-top: 40px;
      max-width: 800px;
      margin: 0 auto;
      padding-left: 20px;
      padding-right: 20px;
    }

    .back-link {
      display: inline-block;
      font-family: sans-serif;
      font-size: 0.95rem;
      color: white;
      background: #e23636;
      padding: 8px 16px;
      border-radius: 20px;
      text-decoration: none;
      margin-bottom: 20px;
      border: 3px solid white;
      box-shadow: 3px 3px 0 #000;
    }

    h1 {
      font-size: 3rem;
      color: white;
      -webkit-text-stroke: 1px #1a237e;
      text-shadow: 4px 4px 0 #000;
      letter-spacing: 2px;
      margin-bottom: 25px;
    }

    /* ===== Timeline slider ===== */
    .slider-wrap {
      position: relative;
      background: rgba(255,255,255,0.06);
      border: 3px solid rgba(255,255,255,0.5);
      border-radius: 14px;
      padding: 40px 20px 30px;
      overflow: hidden;
      backdrop-filter: blur(2px);
    }

    .slide-number {
      position: absolute;
      top: 14px;
      right: 20px;
      font-family: sans-serif;
      font-weight: bold;
      font-size: 1.3rem;
      color: rgba(255,255,255,0.7);
    }

    .slide-image {
      width: 100%;
      max-width: 500px;
      height: 220px;
      margin: 0 auto 20px;
      border-radius: 10px;
      background: rgba(255,255,255,0.1);
      border: 2px dashed rgba(255,255,255,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      color: rgba(255,255,255,0.6);
      font-size: 0.9rem;
      overflow: hidden;
    }

    .slide-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .slide-year {
      font-size: 2.8rem;
      color: white;
      text-shadow: 3px 3px 0 #000;
      margin: 10px 0 6px;
    }

    .slide-title {
      font-family: sans-serif;
      font-weight: bold;
      font-size: 1.2rem;
      color: white;
      margin: 0 0 10px;
      line-height: 1.4;
    }

    .slide-desc {
      font-family: sans-serif;
      font-size: 0.95rem;
      color: rgba(255,255,255,0.85);
      line-height: 1.5;
      max-width: 500px;
      margin: 0 auto;
    }

    /* fade + slide animation for content swap */
    .slide-content {
      animation: slideIn 0.45s ease;
    }

    @keyframes slideIn {
      0%   { opacity: 0; transform: translateX(30px); }
      100% { opacity: 1; transform: translateX(0); }
    }

    .slide-content.reverse {
      animation-name: slideInReverse;
    }

    @keyframes slideInReverse {
      0%   { opacity: 0; transform: translateX(-30px); }
      100% { opacity: 1; transform: translateX(0); }
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 3px solid white;
      background: #e23636;
      color: white;
      font-family: sans-serif;
      font-size: 1.3rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
      z-index: 2;
    }

    .nav-btn:hover {
      transform: translateY(-50%) scale(1.12);
      background: #1a237e;
    }

    .nav-btn.prev { left: 10px; }
    .nav-btn.next { right: 10px; }

    /* progress timeline */
    .timeline-track {
      position: relative;
      margin: 30px auto 0;
      max-width: 500px;
      height: 6px;
      background: rgba(255,255,255,0.25);
      border-radius: 3px;
    }

    .timeline-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background: #e23636;
      border-radius: 3px;
      transition: width 0.4s ease;
    }

    .timeline-dots {
      display: flex;
      justify-content: space-between;
      max-width: 500px;
      margin: 10px auto 0;
    }

    .timeline-dots span {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.35);
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .timeline-dots span.active {
      background: #e23636;
      transform: scale(1.3);
    }

    .range-labels {
      display: flex;
      justify-content: space-between;
      max-width: 500px;
      margin: 8px auto 0;
      font-family: sans-serif;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.6);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="content">
    <a href="index.html" class="back-link">&larr; Kembali ke Home</a>
    <h1>WHEN YAH</h1>

    <div class="slider-wrap">
      <span class="slide-number" id="slide-number">01</span>

      <button class="nav-btn prev" id="prev-btn">&#8249;</button>
      <button class="nav-btn next" id="next-btn">&#8250;</button>

      <div class="slide-content" id="slide-content">
        <div class="slide-image" id="slide-image">Ganti dengan gambar kamu</div>
        <div class="slide-year" id="slide-year">2023</div>
        <div class="slide-title" id="slide-title">Judul milestone di sini</div>
        <div class="slide-desc" id="slide-desc">Tulis deskripsi singkat tentang tahap/bagian project ini.</div>
      </div>

      <div class="timeline-track">
        <div class="timeline-fill" id="timeline-fill"></div>
      </div>
      <div class="timeline-dots" id="timeline-dots"></div>
      <div class="range-labels">
        <span id="range-start">2023</span>
        <span id="range-end">2026</span>
      </div>
    </div>
  </div>

  <script>
    // GANTI data ini sesuai isi project kamu
    const slides = [
      { year: "2023", title: "Mulai belajar HTML & CSS", desc: "Awal mula ngoprek struktur halaman dan styling dasar.", image: "" },
      { year: "2024", title: "Belajar JavaScript", desc: "Mulai bikin elemen interaktif kayak tombol dan animasi.", image: "" },
      { year: "2025", title: "Bikin project pertama", desc: "Nyoba gabungin semua skill jadi satu project utuh.", image: "" },
      { year: "2026", title: "Project ini dibuat", desc: "Portfolio ini sendiri, tempat semua project dikumpulin.", image: "" }
    ];

    let current = 0;
    const slideContent = document.getElementById('slide-content');
    const slideNumber = document.getElementById('slide-number');
    const slideYear = document.getElementById('slide-year');
    const slideTitle = document.getElementById('slide-title');
    const slideDesc = document.getElementById('slide-desc');
    const slideImage = document.getElementById('slide-image');
    const timelineFill = document.getElementById('timeline-fill');
    const timelineDots = document.getElementById('timeline-dots');
    const rangeStart = document.getElementById('range-start');
    const rangeEnd = document.getElementById('range-end');

    function buildDots() {
      timelineDots.innerHTML = '';
      slides.forEach(function(_, i) {
        const dot = document.createElement('span');
        if (i === current) dot.classList.add('active');
        dot.addEventListener('click', function() {
          goTo(i, i > current);
        });
        timelineDots.appendChild(dot);
      });
    }

    function render(reverse) {
      slideContent.classList.remove('slide-content');
      void slideContent.offsetWidth;
      slideContent.classList.add('slide-content');
      slideContent.classList.toggle('reverse', reverse);

      const s = slides[current];
      slideNumber.textContent = String(current + 1).padStart(2, '0');
      slideYear.textContent = s.year;
      slideTitle.textContent = s.title;
      slideDesc.textContent = s.desc;

      if (s.image) {
        slideImage.innerHTML = '<img src="' + s.image + '" alt="' + s.title + '">';
        slideImage.querySelector('img').style.display = 'block';
      } else {
        slideImage.innerHTML = 'Ganti dengan gambar kamu';
      }

      timelineFill.style.width = ((current) / (slides.length - 1) * 100) + '%';
      rangeStart.textContent = slides[0].year;
      rangeEnd.textContent = slides[slides.length - 1].year;
      buildDots();
    }

    function goTo(index, reverse) {
      current = (index + slides.length) % slides.length;
      render(reverse);
    }

    document.getElementById('next-btn').addEventListener('click', function() {
      goTo(current + 1, true);
    });
    document.getElementById('prev-btn').addEventListener('click', function() {
      goTo(current - 1, false);
    });

    render(true);
  </script>

  <div class="mini-spider">
    <svg viewBox="0 0 60 60" width="34" height="34" xmlns="http://www.w3.org/2000/svg">
      <g stroke="#1a237e" stroke-width="2.5" fill="none" stroke-linecap="round">
        <line x1="30" y1="24" x2="10" y2="10" />
        <line x1="30" y1="24" x2="6" y2="24" />
        <line x1="30" y1="24" x2="10" y2="38" />
        <line x1="30" y1="24" x2="18" y2="50" />
        <line x1="30" y1="36" x2="50" y2="10" />
        <line x1="30" y1="36" x2="54" y2="24" />
        <line x1="30" y1="36" x2="50" y2="38" />
        <line x1="30" y1="36" x2="42" y2="50" />
      </g>
      <ellipse cx="30" cy="22" rx="7" ry="6" fill="#e23636" stroke="#1a237e" stroke-width="1.5" />
      <ellipse cx="30" cy="38" rx="11" ry="13" fill="#e23636" stroke="#1a237e" stroke-width="1.5" />
      <circle cx="27" cy="20" r="1.6" fill="white" />
      <circle cx="33" cy="20" r="1.6" fill="white" />
    </svg>
  </div>

  <svg class="corner-web" viewBox="0 0 90 90" xmlns="http://www.w3.org/2000/svg" style="position:fixed; top:0; right:0; width:90px; height:90px; z-index:19; opacity:0.6; pointer-events:none;">
    <g stroke="white" stroke-width="1.2" fill="none">
      <line x1="90" y1="0" x2="0" y2="0" />
      <line x1="90" y1="0" x2="0" y2="90" />
      <line x1="90" y1="20" x2="20" y2="0" />
      <line x1="90" y1="45" x2="45" y2="0" />
      <line x1="90" y1="70" x2="70" y2="0" />
      <path d="M 90 5 Q 75 12 68 25" />
      <path d="M 90 15 Q 68 25 55 45" />
      <path d="M 90 28 Q 60 40 40 62" />
      <path d="M 90 45 Q 55 55 28 82" />
      <path d="M 90 62 Q 50 68 15 88" />
    </g>
  </svg>

  <style>
    .mini-spider {
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 20;
      animation: crawl 6s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes crawl {
      0%   { transform: translate(0, 0) rotate(0deg); }
      15%  { transform: translate(-40px, 30px) rotate(-15deg); }
      30%  { transform: translate(-90px, 10px) rotate(10deg); }
      45%  { transform: translate(-60px, 90px) rotate(-10deg); }
      60%  { transform: translate(-10px, 130px) rotate(15deg); }
      75%  { transform: translate(-70px, 160px) rotate(-5deg); }
      90%  { transform: translate(-20px, 60px) rotate(5deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }
  </style>

</body>
</html>
